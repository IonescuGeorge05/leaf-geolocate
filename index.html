<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapbox Geolocation Map</title>

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet">

  <!-- Your styles -->
  <link rel="stylesheet" href="style.css" />

  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Mapbox JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <!-- Login Modal -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <button id="close-login" class="close-btn">X</button>
      <h2>Please log in</h2>
      <p>You must be logged in to view station details.</p>
      <button id="login-btn">Log In</button>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Controls -->
  <button id="recenter-btn">📍 Recenter</button>

  <!-- Permanent login/logout -->
  <button id="permanent-login-btn" class="permanent-login">Log In</button>

  <!-- Legend -->
  <div id="legend">
    <div class="item"><div class="color-box" style="background:red"></div>Fuel Station</div>
    <div class="item"><div class="color-box" style="background:green"></div>Charging Station</div>
    <div class="item"><div class="color-box" style="background:blue"></div>Fuel + Charging</div>
  </div>

  <!-- App code -->
  <script src="app.js"></script>

</body>
</html>
