<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="docs/stylelogin.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="login-container">
<h2>Sign Up</h2>
<form id="signup-form">
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<input type="password" id="password2" placeholder="Confirm Password" required>
<button type="submit">Sign Up</button>
</form>
<button id="google-signup">Sign Up with Google</button>
<p class="signup-text">Already have an account? <a href="login.html">Login</a></p>
</div>
<script>
document.getElementById('signup-form').addEventListener('submit', e=>{
  e.preventDefault();
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  const pass2=document.getElementById('password2').value;
  if(pass!==pass2){ alert("Passwords do not match"); return; }
  auth.createUserWithEmailAndPassword(email,pass)
  .then(()=>window.location.href="index.html")
  .catch(err=>alert(err.message));
});
document.getElementById('google-signup').addEventListener('click',()=>{
  auth.signInWithPopup(provider).then(()=>window.location.href="index.html")
  .catch(err=>alert(err.message));
});
</script>
</body>
</html>
